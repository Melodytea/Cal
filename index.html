<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" id="themeColor" content="#f1f5f9">
<title>지역화폐 충전 계산기</title>
<script>
  (function () {
    var t = 'auto';
    try { t = localStorage.getItem('lc_theme') || 'auto'; } catch (e) {}
    var d = t === 'dark' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    if (d) document.documentElement.classList.add('dark');
  })();
</script>
<style>
  :root {
    color-scheme: light;
    --bg: #f1f5f9; --text: #0f172a; --card: #fff; --sub: #334155; --muted: #64748b;
    --border: #e2e8f0; --input: #f8fafc; --input-focus: #fff; --suffix: #94a3b8; --accent: #2563eb;
    --chip-bg: #fff; --chip-border: #cbd5e1; --chip-text: #334155; --chip-active: #eff6ff;
    --reset-text: #dc2626; --reset-border: #fecaca;
    --shadow: 0 1px 3px rgba(0,0,0,.06);
    --result1: #2563eb; --result2: #1d4ed8;
    --toast-bg: #0f172a; --toast-text: #fff;
  }
  html.dark {
    color-scheme: dark;
    --bg: #0b1120; --text: #e2e8f0; --card: #1e293b; --sub: #cbd5e1; --muted: #94a3b8;
    --border: #334155; --input: #0f172a; --input-focus: #0f172a; --suffix: #64748b; --accent: #60a5fa;
    --chip-bg: #1e293b; --chip-border: #334155; --chip-text: #cbd5e1; --chip-active: #1e3a5f;
    --reset-text: #f87171; --reset-border: #7f1d1d;
    --shadow: none;
    --result1: #1d4ed8; --result2: #1e3a8a;
    --toast-bg: #e2e8f0; --toast-text: #0f172a;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
    transition: background .2s, color .2s;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 10px 14px 30px; }

  /* 헤더 */
  .top { display: flex; justify-content: space-between; align-items: center; margin: 2px 2px 10px; }
  h1 { font-size: 17px; margin: 0; }
  .theme-btn {
    border: 1px solid var(--chip-border); background: var(--chip-bg); color: var(--chip-text);
    border-radius: 999px; width: 36px; height: 36px; font-size: 16px; padding: 0;
  }

  .card { background: var(--card); border-radius: 16px; padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow); transition: background .2s; }
  .card h2 { font-size: 14px; margin: 0 0 4px; color: var(--sub); }

  /* 결과 카드 */
  .result { background: linear-gradient(135deg, var(--result1), var(--result2)); color: #fff; }
  .res-top { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #bfdbfe; font-weight: 600; }
  .badge {
    background: rgba(255,255,255,.16); color: #fff; border: 0; border-radius: 999px;
    padding: 4px 10px; font-size: 12px; font-weight: 600;
  }
  .big-row { display: flex; align-items: baseline; justify-content: space-between; margin: 4px 0 10px; cursor: pointer; }
  .big { font-size: 34px; font-weight: 800; letter-spacing: -0.5px; }
  .big small { font-size: 17px; font-weight: 600; margin-left: 2px; }
  .copy-hint { font-size: 11px; color: #bfdbfe; white-space: nowrap; }
  .stats {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
    border-top: 1px solid rgba(255,255,255,.2); padding-top: 10px;
  }
  .stats div { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .stats span { font-size: 11px; color: #bfdbfe; }
  .stats b { font-size: 14px; font-weight: 700; word-break: keep-all; }
  .res-note, .opt {
    background: rgba(255,255,255,.13); border-radius: 10px; padding: 8px 10px;
    margin-top: 8px; font-size: 12px; line-height: 1.45;
  }
  .res-note { color: #fef3c7; }
  .opt b { font-size: 13px; }

  /* 입력 */
  label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 5px; }
  .row { display: flex; gap: 8px; }
  .row > div { flex: 1; min-width: 0; }
  .input-box { position: relative; }
  .input-box input, select {
    width: 100%; font-size: 17px; padding: 10px 30px 10px 12px;
    border: 1.5px solid var(--border); border-radius: 12px; background: var(--input); outline: none;
    -webkit-appearance: none; appearance: none; color: var(--text);
  }
  select { padding-right: 12px; font-size: 16px; }
  .input-box input:focus, select:focus { border-color: var(--accent); background: var(--input-focus); }
  .input-box .suffix { position: absolute; right: 11px; top: 50%; transform: translateY(-50%); color: var(--suffix); font-size: 14px; }

  /* 버튼 */
  .chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
  .chips button {
    border: 1px solid var(--chip-border); background: var(--chip-bg); border-radius: 999px;
    padding: 9px 0; font-size: 14px; color: var(--chip-text); transition: background .15s, border-color .15s;
  }
  .chips button:active, .chips button.flash { background: var(--chip-active); border-color: var(--accent); }
  .chips button.reset { color: var(--reset-text); border-color: var(--reset-border); font-weight: 600; }

  /* 설정 */
  .settings label { margin-top: 10px; }
  details summary { font-size: 13px; color: var(--muted); cursor: pointer; padding: 4px 0; margin-top: 10px; }

  .hidden { display: none !important; }
  .toast {
    position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%);
    background: var(--toast-bg); color: var(--toast-text); padding: 10px 18px; border-radius: 999px; font-size: 14px;
    opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: .92; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>💳 지역화폐 충전 계산기</h1>
    <button class="theme-btn" id="themeBtn" aria-label="테마 변경">🌓</button>
  </div>

  <!-- 결과 -->
  <div class="card result">
    <div class="res-top">
      <span>이만큼 충전하세요</span>
      <button class="badge" id="sumCfg">10% · 1원</button>
    </div>
    <div class="big-row" id="copyArea">
      <div class="big" id="tCharge">0<small>원</small></div>
      <span class="copy-hint">탭하면 복사 📋</span>
    </div>
    <div class="stats">
      <div><span>인센티브</span><b id="tBonus">+0원</b></div>
      <div><span>충전 후 잔액</span><b id="tFinal">0원</b></div>
      <div><span>목표와 차이</span><b id="tDiff">-</b></div>
    </div>
    <div id="tAlt" class="hidden"></div>
    <div id="tNotice" class="res-note hidden"></div>
  </div>

  <!-- 입력 -->
  <div class="card">
    <div class="row">
      <div>
        <label>현재 잔액</label>
        <div class="input-box">
          <input id="cur" type="text" inputmode="numeric" placeholder="0">
          <span class="suffix">원</span>
        </div>
      </div>
      <div>
        <label>목표 잔액</label>
        <div class="input-box">
          <input id="target" type="text" inputmode="numeric" value="0">
          <span class="suffix">원</span>
        </div>
      </div>
    </div>
    <div class="chips" id="chips">
      <button data-v="0" class="reset">0원</button>
      <button data-v="10000">+1만</button>
      <button data-v="30000">+3만</button>
      <button data-v="50000">+5만</button>
      <button data-v="100000">+10만</button>
      <button data-v="150000">+15만</button>
      <button data-v="300000">+30만</button>
      <button data-v="500000">+50만</button>
    </div>
  </div>

  <!-- 설정 (맨 아래) -->
  <div class="card settings" id="settings">
    <h2>⚙️ 기본 설정</h2>
    <div class="row">
      <div>
        <label>추가 충전(인센티브)</label>
        <div class="input-box">
          <input id="rate" type="text" inputmode="decimal" value="10">
          <span class="suffix">%</span>
        </div>
      </div>
      <div>
        <label>충전 단위</label>
        <select id="unit">
          <option value="1" selected>1원</option>
          <option value="10">10원</option>
          <option value="100">100원</option>
          <option value="1000">1,000원</option>
          <option value="10000">10,000원</option>
        </select>
      </div>
    </div>
    <details>
      <summary>고급 설정</summary>
      <label>인센티브 소수점 처리</label>
      <select id="round">
        <option value="floor" selected>버림 (일반적)</option>
        <option value="round">반올림</option>
        <option value="ceil">올림</option>
      </select>
      <label>인센티브 적용 한도 (충전액 기준, 비우면 무제한)</label>
      <div class="input-box">
        <input id="cap" type="text" inputmode="numeric" placeholder="예: 500,000">
        <span class="suffix">원</span>
      </div>
    </details>
  </div>
</div>
<div class="toast" id="toast">복사됨</div>

<script>
const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString('ko-KR');
const num = el => parseInt((el.value || '').replace(/[^\d]/g, ''), 10) || 0;

/* ===== 다크 모드 ===== */
const THEMES = ['auto', 'light', 'dark'];
const THEME_ICON = { auto: '🌓', light: '☀️', dark: '🌙' };
const THEME_NAME = { auto: '자동', light: '라이트', dark: '다크' };
const mq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
let theme = 'auto';
try { theme = localStorage.getItem('lc_theme') || 'auto'; } catch (e) {}

function applyTheme() {
  const dark = theme === 'dark' || (theme === 'auto' && mq && mq.matches);
  document.documentElement.classList.toggle('dark', dark);
  $('themeBtn').textContent = THEME_ICON[theme];
  $('themeColor').setAttribute('content', dark ? '#0b1120' : '#f1f5f9');
}
$('themeBtn').addEventListener('click', () => {
  theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
  try { localStorage.setItem('lc_theme', theme); } catch (e) {}
  applyTheme();
  toast('테마: ' + THEME_NAME[theme]);
});
if (mq) {
  const onSys = () => { if (theme === 'auto') applyTheme(); };
  if (mq.addEventListener) mq.addEventListener('change', onSys);
  else if (mq.addListener) mq.addListener(onSys);
}
applyTheme();

/* ===== 계산 ===== */
function cfg() {
  const r = parseFloat($('rate').value);
  const capStr = $('cap').value.replace(/\D/g, '');
  return {
    rate: isNaN(r) || r < 0 ? 0 : r,
    bp: Math.round((isNaN(r) || r < 0 ? 0 : r) * 100),
    unit: parseInt($('unit').value, 10),
    mode: $('round').value,
    cap: capStr ? parseInt(capStr, 10) : Infinity
  };
}

function bonus(x, c) {
  const v = Math.min(x, c.cap) * c.bp / 10000;
  if (c.mode === 'round') return Math.round(v);
  if (c.mode === 'ceil') return Math.ceil(v);
  return Math.floor(v);
}
const total = (x, c) => x + bonus(x, c);

function minCharge(need, c) {
  let lo = 0, hi = Math.ceil(need / c.unit);
  while (lo < hi) {
    const mid = Math.floor((lo + hi) / 2);
    if (total(mid * c.unit, c) >= need) hi = mid; else lo = mid + 1;
  }
  return lo * c.unit;
}

function calc() {
  const c = cfg();
  const cur = num($('cur'));
  const target = num($('target'));
  const need = Math.max(0, target - cur);
  const notice = $('tNotice'), alt = $('tAlt');

  // 결과 카드 우상단 설정 요약
  $('sumCfg').textContent = `${c.rate}% · ${fmt(c.unit)}원` + (c.cap !== Infinity ? ' · 한도' : '');

  if (need === 0) {
    $('tCharge').innerHTML = '0<small>원</small>';
    $('tCharge').dataset.v = '';
    $('tBonus').textContent = '+0원';
    $('tFinal').textContent = fmt(cur) + '원';
    $('tDiff').textContent = '-';
    alt.className = 'hidden';
    notice.className = 'res-note';
    notice.textContent = target ? '이미 목표 잔액 이상이에요. 충전할 필요가 없어요.' : '목표 잔액을 입력하거나 아래 버튼을 눌러 주세요.';
    save();
    return;
  }

  const x = minCharge(need, c);
  const b = bonus(x, c);
  const fin = cur + x + b;
  const diff = fin - target;

  $('tCharge').innerHTML = fmt(x) + '<small>원</small>';
  $('tCharge').dataset.v = x;
  $('tBonus').textContent = '+' + fmt(b) + '원';
  $('tFinal').textContent = fmt(fin) + '원';
  $('tDiff').textContent = diff === 0 ? '딱 맞음 ✅' : '+' + fmt(diff) + '원 초과';

  if (diff === 0) {
    alt.className = 'hidden';
    notice.className = 'res-note hidden';   // 딱 맞으면 안내 숨김 (공간 절약)
  } else {
    const xl = x - c.unit;
    let html = '';
    if (xl > 0) {
      const finL = cur + total(xl, c);
      html = `<div class="opt">⬇️ 모자라게: <b>${fmt(xl)}원</b> 충전 → ${fmt(finL)}원 (${fmt(target - finL)}원 부족)</div>`;
    }
    alt.innerHTML = html;
    alt.className = html ? '' : 'hidden';
    notice.className = 'res-note';
    notice.textContent = c.unit > 1
      ? `충전 단위(${fmt(c.unit)}원) 때문에 딱 맞출 수 없어서, 목표를 넘기는 최소 금액을 보여드려요.`
      : `소수점 처리 때문에 이 금액은 딱 만들 수 없어서, 목표를 넘기는 최소 금액을 보여드려요.`;
  }
  save();
}

/* ===== 입력 ===== */
['cur', 'target', 'cap'].forEach(id => {
  $(id).addEventListener('input', e => {
    const raw = e.target.value.replace(/[^\d]/g, '');
    e.target.value = raw ? fmt(parseInt(raw, 10)) : '';
    calc();
  });
});
$('rate').addEventListener('input', e => {
  e.target.value = e.target.value.replace(/[^\d.]/g, '').replace(/(\..*)\./g, '$1');
  calc();
});
['unit', 'round'].forEach(id => $(id).addEventListener('change', calc));

/* ===== 빠른 금액 버튼: 누를 때마다 더하기, 0원은 초기화 ===== */
$('chips').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const v = parseInt(btn.dataset.v, 10);
  $('target').value = fmt(v === 0 ? 0 : num($('target')) + v);
  btn.classList.add('flash');
  setTimeout(() => btn.classList.remove('flash'), 180);
  calc();
});

/* ===== 설정 요약 누르면 설정으로 이동 ===== */
$('sumCfg').addEventListener('click', () => {
  $('settings').scrollIntoView({ behavior: 'smooth', block: 'start' });
});

/* ===== 복사 ===== */
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1200);
}
$('copyArea').addEventListener('click', () => {
  const v = $('tCharge').dataset.v;
  if (!v) return;
  const done = () => toast(fmt(+v) + '원 복사됨');
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(v).then(done).catch(fallback);
  else fallback();
  function fallback() {
    const ta = document.createElement('textarea'); ta.value = v; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove(); done();
  }
});

/* ===== 저장 ===== */
function save() {
  try { localStorage.setItem('lc_cfg', JSON.stringify({ rate: $('rate').value, unit: $('unit').value, round: $('round').value, cap: $('cap').value })); } catch (e) {}
}
try {
  const s = JSON.parse(localStorage.getItem('lc_cfg'));
  if (s) { $('rate').value = s.rate ?? '10'; $('unit').value = s.unit || '1'; $('round').value = s.round || 'floor'; $('cap').value = s.cap || ''; }
} catch (e) {}

calc();
</script>
</body>
</html>
